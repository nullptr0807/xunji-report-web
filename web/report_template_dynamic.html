<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>训记 · 训练分析报告</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary: #f5f5f7;
    --bg-card: rgba(255,255,255,0.50);
    --bg-card-strong: rgba(255,255,255,0.70);
    --ink: #1d1d1f;
    --ink-2: rgba(0,0,0,0.58);
    --ink-3: rgba(0,0,0,0.36);
    --accent: #C8553D;
    --accent-2: #8FA98E;
    --accent-3: #5C6B73;
    --accent-4: #D4A574;
    --radius: 18px;
    --font: 'Inter','SF Pro Display','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body {
    font-family: var(--font);
    background: linear-gradient(180deg, #fafafc 0%, #f0f1f5 100%);
    color: var(--ink);
    min-height: 100vh; background-attachment: fixed; position: relative;
    padding: 32px 20px 60px;
  }
  body::before {
    content:''; position: fixed; inset: -10vmax; pointer-events: none; z-index: 0;
    background:
      radial-gradient(36vmax 36vmax at 14% 16%, rgba(200,85,61,0.32), transparent 60%),
      radial-gradient(34vmax 34vmax at 86% 20%, rgba(143,169,142,0.30), transparent 60%),
      radial-gradient(40vmax 40vmax at 78% 86%, rgba(212,165,116,0.30), transparent 60%),
      radial-gradient(32vmax 32vmax at 18% 84%, rgba(92,107,115,0.22), transparent 60%);
    filter: blur(30px) saturate(135%);
  }
  body::after {
    content:''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 32px 32px; opacity: 0.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }

  .glass {
    background: var(--bg-card);
    backdrop-filter: blur(36px) saturate(180%); -webkit-backdrop-filter: blur(36px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 0 0 0.5px rgba(0,0,0,0.04), 0 18px 48px rgba(31,38,72,0.10);
    padding: 28px; margin-bottom: 20px; position: relative;
  }
  .glass > * { position: relative; z-index: 1; }

  .hero { text-align: center; padding: 36px 20px; }
  .hero .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-2); margin-bottom: 10px; }
  .hero .title { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .hero .range { color: var(--ink-2); margin-top: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .hero .mode-tag {
    display: inline-block; margin-top: 12px; padding: 4px 12px;
    background: rgba(200,85,61,0.10); color: var(--accent);
    border-radius: 16px; font-size: 12px; letter-spacing: 0.04em;
  }

  /* Hook (AI 教练点评) */
  .hook {
    background: linear-gradient(135deg, #1d1d1f 0%, #3a3a3e 100%);
    color: #fff; border-radius: var(--radius);
    padding: 30px 32px; margin-bottom: 20px; position: relative; overflow: hidden;
  }
  .hook::before {
    content:''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(40vmax 30vmax at 100% 0%, rgba(200,85,61,0.30), transparent 60%);
  }
  .hook .h-tag {
    display: inline-block; font-size: 11px; letter-spacing: 0.14em; padding: 4px 10px;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px; margin-bottom: 16px; text-transform: uppercase;
  }
  .hook .h-head { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
  .hook .h-sub { font-size: 15px; margin-top: 10px; opacity: 0.92; line-height: 1.5; }
  .hook .h-overall {
    font-size: 14.5px; margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.18);
    line-height: 1.85; opacity: 0.95; text-align: justify;
  }

  /* Section card */
  .section-card { padding: 26px 28px; }
  .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.01em; }
  .chart-host { height: 280px; }
  .section-take {
    margin-top: 16px; padding: 14px 16px;
    background: rgba(0,0,0,0.04); border-left: 3px solid var(--accent);
    border-radius: 6px; font-size: 14px; color: var(--ink-2); line-height: 1.7;
  }

  /* kv_grid */
  .kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kv {
    background: rgba(255,255,255,0.55); border-radius: 12px;
    padding: 14px 16px;
  }
  .kv .k { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
  .kv .v {
    font-size: 22px; font-weight: 700; margin-top: 6px; color: var(--ink);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }

  /* prose */
  .prose-text { font-size: 14.5px; line-height: 1.85; color: var(--ink-2); text-align: justify; }

  /* CTA */
  .cta-mine {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    margin-top: 32px; padding: 24px 28px; flex-wrap: wrap;
  }
  .cta-headline { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .cta-sub { font-size: 13px; color: var(--ink-3); }
  .cta-btn {
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 10px;
    text-decoration: none; font-weight: 500; white-space: nowrap; font-size: 14px;
  }
  .cta-btn:hover { background: #000; }

  footer { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 30px; }
  footer a { color: var(--ink-2); text-decoration: none; }
  .disclaimer {
    max-width: 580px; margin: 0 auto 14px; padding: 12px 16px;
    background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.06);
    border-radius: 8px; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; text-align: left;
  }
  .disclaimer strong { color: var(--ink-2); font-weight: 600; }

  @media (max-width: 720px) {
    body { padding: 16px 12px 40px; }
    .glass { padding: 20px 16px; border-radius: 14px; }
    .hero .title { font-size: 22px; }
    .hook { padding: 22px 20px; }
    .hook .h-head { font-size: 21px; }
    .hook .h-sub { font-size: 14px; }
    .cta-mine { flex-direction: column; align-items: stretch; text-align: center; padding: 20px; }
    .cta-btn { text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero glass">
    <div class="label">训记 · 训练分析报告</div>
    <div class="title" id="title">训练分析</div>
    <div class="range" id="range"></div>
    <div class="mode-tag" id="mode-tag">AI 自适应报告</div>
  </div>

  <div class="hook" id="hook" style="display:none">
    <span class="h-tag">AI 教练点评</span>
    <div class="h-head" id="hook-head"></div>
    <div class="h-sub" id="hook-sub"></div>
    <div class="h-overall" id="hook-overall" style="display:none"></div>
  </div>

  <div id="sections-host"></div>

  <div class="cta-mine glass">
    <div class="cta-text">
      <div class="cta-headline">想看看你自己的训练数据被这样剖析？</div>
      <div class="cta-sub">粘贴你的训记 API Key，几十秒就能生成一份属于你的报告。</div>
    </div>
    <a href="../../" class="cta-btn">我也要测 →</a>
  </div>

  <footer>
    <div class="disclaimer">
      <strong>免责声明</strong> · 本项目为个人爱好开源项目，与训记 App 官方无关。
      AI 生成的点评仅供参考，可能存在偏差。请勿用于医疗、伤病评估或商业决策用途。
      所有数据仅用于本次报告生成，缓存最多 7 天后自动清除。
    </div>
    由 <a href="../../">xunji-report-web</a> 生成 · <span id="gen-at"></span>
    · <a href="https://github.com/nullptr0807/xunji-report-web" target="_blank">GitHub</a>
  </footer>
</div>

<script>
(async function() {
  const [reportData, dyn] = await Promise.all([
    fetch('report_data.json').then(r => r.json()),
    fetch('dynamic_sections.json').then(r => r.json()),
  ]);

  // ===== Hero =====
  document.getElementById('title').textContent = '我的训练分析';
  const s = reportData.summary || {};
  let range = '';
  if (s.date_start && s.date_end) range = s.date_start + '  →  ' + s.date_end;
  document.getElementById('range').textContent = range;
  document.getElementById('gen-at').textContent =
    (reportData.generated_at || '').slice(0, 16).replace('T', ' ') + ' UTC';

  // ===== Hook =====
  if (dyn.hero_hook) {
    document.getElementById('hook').style.display = 'block';
    document.getElementById('hook-head').textContent = dyn.hero_hook.headline || '';
    document.getElementById('hook-sub').textContent = dyn.hero_hook.subline || '';
  }
  if (dyn.overall_take) {
    document.getElementById('hook').style.display = 'block';
    const oel = document.getElementById('hook-overall');
    oel.textContent = dyn.overall_take;
    oel.style.display = 'block';
  }

  // ===== Sections =====
  const host = document.getElementById('sections-host');
  const sections = Array.isArray(dyn.sections) ? dyn.sections : [];
  sections.forEach((sec, idx) => {
    const card = document.createElement('div');
    card.className = 'glass section-card';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = sec.title || ('Section ' + (idx + 1));
    card.appendChild(title);

    try {
      renderSection(card, sec, idx);
    } catch (err) {
      const p = document.createElement('div');
      p.className = 'section-take';
      p.textContent = '(渲染失败：' + (err.message || err) + ')';
      card.appendChild(p);
    }

    if (sec.take) {
      const t = document.createElement('div');
      t.className = 'section-take';
      t.textContent = sec.take;
      card.appendChild(t);
    }
    host.appendChild(card);
  });

  function renderSection(card, sec, idx) {
    const kind = sec.kind || 'prose';
    const data = sec.data || {};

    if (kind === 'chart_line' || kind === 'chart_bar') {
      const host = document.createElement('div');
      host.className = 'chart-host';
      host.id = 'chart-' + idx;
      card.appendChild(host);
      // Delay to next tick so the element has a width
      requestAnimationFrame(() => drawChart(host, kind, data));
    } else if (kind === 'kv_grid') {
      const grid = document.createElement('div');
      grid.className = 'kv-grid';
      (data.items || []).forEach(item => {
        const kv = document.createElement('div');
        kv.className = 'kv';
        const k = document.createElement('div'); k.className = 'k'; k.textContent = item.k || '';
        const v = document.createElement('div'); v.className = 'v'; v.textContent = item.v || '';
        kv.appendChild(k); kv.appendChild(v); grid.appendChild(kv);
      });
      card.appendChild(grid);
    } else {
      // prose (or unknown — degrade to prose)
      const p = document.createElement('div');
      p.className = 'prose-text';
      p.textContent = data.text || '';
      card.appendChild(p);
    }
  }

  function drawChart(hostEl, kind, data) {
    const xs = data.x || [];
    const ys = data.y || [];
    if (!xs.length || xs.length !== ys.length) {
      hostEl.innerHTML = '<div class="prose-text">(图表数据缺失或 x/y 长度不一致)</div>';
      return;
    }
    const chart = LightweightCharts.createChart(hostEl, {
      width: hostEl.clientWidth,
      height: 280,
      layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#444', fontFamily: 'Inter,sans-serif', fontSize: 12 },
      grid: { vertLines: { color: 'rgba(0,0,0,0.04)' }, horzLines: { color: 'rgba(0,0,0,0.06)' } },
      rightPriceScale: { borderColor: 'rgba(0,0,0,0.08)' },
      timeScale: { borderColor: 'rgba(0,0,0,0.08)', visible: false },
      handleScroll: false, handleScale: false,
      crosshair: { mode: 0 },
      localization: {
        priceFormatter: v => {
          const yl = (data.y_label || '').toLowerCase();
          if (yl === 'km' || yl.includes('km')) return v.toFixed(1) + ' km';
          if (yl.includes('kg')) return v.toFixed(0) + ' kg';
          if (yl.includes('min') || yl.includes('分钟')) return v.toFixed(0) + ' min';
          if (yl.includes('bpm') || yl.includes('心率')) return v.toFixed(0) + ' bpm';
          return v.toLocaleString();
        },
      },
    });

    const baseTime = Math.floor(Date.now() / 1000);
    const points = xs.map((label, i) => ({
      time: baseTime - (xs.length - 1 - i) * 86400,
      value: Number(ys[i]) || 0,
      _label: label,
    }));

    let series;
    if (kind === 'chart_line') {
      series = chart.addAreaSeries({
        lineColor: '#C8553D', topColor: 'rgba(200,85,61,0.30)', bottomColor: 'rgba(200,85,61,0.02)',
        lineWidth: 2,
      });
    } else {
      series = chart.addHistogramSeries({ color: 'rgba(200,85,61,0.75)', priceFormat: { type: 'volume' } });
    }
    series.setData(points);

    // X-axis labels: render as a custom row beneath the chart (timeScale hidden
    // because we don't pass real timestamps — labels are strings like "5-12")
    const xLabels = document.createElement('div');
    xLabels.style.cssText = 'display:flex; justify-content:space-between; font-size:11px; color:rgba(0,0,0,0.45); padding:6px 8px 0; font-variant-numeric: tabular-nums;';
    const indices = sampleIndices(xs.length, 6);
    indices.forEach(i => {
      const span = document.createElement('span');
      span.textContent = xs[i];
      xLabels.appendChild(span);
    });
    hostEl.parentNode.insertBefore(xLabels, hostEl.nextSibling);

    chart.timeScale().fitContent();

    new ResizeObserver(() => chart.applyOptions({ width: hostEl.clientWidth })).observe(hostEl);
  }

    function sampleIndices(n, target) {
      if (n <= target) return Array.from({length: n}, (_, i) => i);
      const out = [];
      for (let i = 0; i < target; i++) out.push(Math.round(i * (n - 1) / (target - 1)));
      return out;
    }

  // Signal readiness for headless snapshot
  setTimeout(() => { document.body.dataset.ready = '1'; }, 600);
})();
</script>
</body>
</html>
